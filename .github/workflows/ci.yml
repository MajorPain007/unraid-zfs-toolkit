name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unraid builds in the wild still ship PHP 7, so every endpoint has to parse
  # there as well. setup-php is cached; adding ondrej/php via apt took minutes
  # on every push and depended on an external repository staying up.
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax check on PHP ${{ matrix.php }}
        run: |
          fail=0
          for f in src/scripts/*.php src/*.page src/ZFSToolkitPage.php; do
            [ -f "$f" ] || continue
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          exit $fail

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Test suite
        run: bash tests/run.sh

      - name: shellcheck (errors are fatal)
        run: |
          shellcheck --severity=error --shell=bash \
            src/scripts/*.sh src/event/* scripts/*.sh tests/*.sh

      - name: shellcheck (warnings, informational)
        continue-on-error: true
        run: |
          shellcheck --severity=warning --shell=bash \
            src/scripts/*.sh src/event/* scripts/*.sh tests/*.sh

      - name: Build package
        run: |
          ZDC_OUT_DIR=dist ZDC_SKIP_PLG=1 ./scripts/build.sh 2026.01.01.01
          tar -tJf dist/*.txz
          test -s dist/zfs.toolkit-2026.01.01.01-x86_64-1.txz

      - name: Working tree must be clean after a test build
        run: |
          if ! git diff --quiet; then
            echo "::error::build.sh modified tracked files during a test build"
            git --no-pager diff --stat
            exit 1
          fi
