name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Unit tests, static checks, syntax
        run: bash tests/run.sh

  zfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install ZFS
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q zfsutils-linux rsync >/dev/null
          sudo modprobe zfs
      - name: Conversion
        run: sudo -E env "PATH=$PATH" bash tests/integration/conversion.sh
      - name: Snapshots
        run: sudo -E env "PATH=$PATH" bash tests/integration/snapshots.sh
      - name: Browse and restore
        run: sudo -E env "PATH=$PATH" bash tests/integration/browse.sh
      - name: Replication
        run: sudo -E env "PATH=$PATH" bash tests/integration/replication.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: |
          ZDC_OUT_DIR=dist ZDC_SKIP_PLG=1 ./scripts/build.sh 2026.01.01.01
          tar -tJf dist/zfs.toolkit-2026.01.01.01-x86_64-1.txz | grep -q 'usr/local/emhttp/plugins/zfs.toolkit/bin/zfs-toolkit'
          tar -tJf dist/zfs.toolkit-2026.01.01.01-x86_64-1.txz | grep -q 'usr/local/emhttp/plugins/zfs.toolkit/assets/app.js'
          mkdir x && tar -C x -xJf dist/zfs.toolkit-2026.01.01.01-x86_64-1.txz && file x/usr/local/emhttp/plugins/zfs.toolkit/bin/zfs-toolkit | grep -q 'x86-64.*statically linked'
          rm -rf x
      - name: A test build changes nothing tracked
        run: git diff --exit-code
